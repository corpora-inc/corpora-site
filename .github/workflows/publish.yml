name: publish
on:
  workflow_dispatch:
  repository_dispatch:
    types: [corpora-site]
  schedule:
    # Hourly: picks up merged corpora-site changes on encorpora main.
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: corpora-inc/encorpora
          sparse-checkout: |
            corpora-site
            amp
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            amp/package-lock.json
            corpora-site/package-lock.json
      # The site renders sample problems from AMP's own sources.
      - run: npm ci --no-audit --no-fund
        working-directory: amp
      - name: Build
        working-directory: corpora-site
        env:
          CONFIG: ${{ vars.CORPORA_SITE_CONFIG }}
          FUNDING_1: ${{ vars.CORPORA_SITE_FUNDING_1 }}
          FUNDING_2: ${{ vars.CORPORA_SITE_FUNDING_2 }}
          FUNDING_3: ${{ vars.CORPORA_SITE_FUNDING_3 }}
        run: |
          npm ci --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const config = JSON.parse(process.env.CONFIG);
          const chunks = [1, 2, 3].map(n => process.env[`FUNDING_${n}`] || '');
          if (chunks.some(Boolean)) {
            if (!chunks[0]) throw new Error('Funding chunks must start at 1');
            let empty = false;
            config.funding = chunks.flatMap(chunk => {
              if (!chunk) { empty = true; return []; }
              if (empty) throw new Error('Funding chunks must be consecutive');
              const routes = JSON.parse(chunk);
              if (!Array.isArray(routes)) throw new Error('Funding chunk must be an array');
              return routes;
            });
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/site.json`, JSON.stringify(config));
          NODE
          CORPORA_SITE_CONFIG="$RUNNER_TEMP/site.json" npm run build
          echo corpora.inc > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: corpora-site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
