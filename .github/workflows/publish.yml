name: publish
on:
  workflow_dispatch:
  repository_dispatch:
    types: [corpora-site]
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: corpora-inc/encorpora
          sparse-checkout: |
            corpora-site
            amp
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            amp/package-lock.json
            corpora-site/package-lock.json
      # The site renders sample problems from AMP's own sources.
      - run: npm ci --no-audit --no-fund
        working-directory: amp
      - name: Build
        working-directory: corpora-site
        env:
          CONFIG: ${{ vars.CORPORA_SITE_CONFIG }}
        run: |
          npm ci --no-audit --no-fund
          printf '%s' "$CONFIG" > "$RUNNER_TEMP/site.json"
          CORPORA_SITE_CONFIG="$RUNNER_TEMP/site.json" npm run build
          echo corpora.inc > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: corpora-site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
